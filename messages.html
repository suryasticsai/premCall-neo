<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Conversation — PremCall</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --void: #030407; --void-2: #080b14; --surface: #0f111a; --surface-2: #161926;
            --surface-3: #1e2233; --line: rgba(255,255,255,0.06); --line-2: rgba(255,255,255,0.10);
            --text: #f0f2f7; --text-dim: #8b92a8; --text-faint: #4a5068;
            --primary: #8b5cf6; --primary-glow: rgba(139,92,246,0.35); --accent: #06b6d4;
            --go: #10b981; --go-glow: rgba(16,185,129,0.30); --stop: #f43f5e; --stop-glow: rgba(244,63,94,0.30);
            --warn: #f59e0b; --radius-xl: 24px; --radius-lg: 18px; --radius-md: 14px;
            --font-display: 'Space Grotesk',sans-serif; --font-body: 'Inter',sans-serif;
            --safe-t: env(safe-area-inset-top,0px); --safe-b: env(safe-area-inset-bottom,0px);
        }
        body.light-mode {
            --void: #f5f7fa; --void-2: #ffffff; --surface: #ffffff; --surface-2: #f1f5f9; --surface-3: #e2e8f0;
            --line: rgba(0,0,0,0.06); --line-2: rgba(0,0,0,0.10); --text: #0f172a; --text-dim: #475569; --text-faint: #94a3b8;
            --primary: #7c3aed; --primary-glow: rgba(124,58,237,0.20); --accent: #0891b2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html,body { height: 100%; overflow: hidden; font-family: var(--font-body); color: var(--text); background: var(--void); }
        .mesh-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 80% 50% at 20% 40%, rgba(139,92,246,0.06) 0%, transparent 50%), var(--void); }
        body.light-mode .mesh-bg { background: radial-gradient(ellipse 80% 50% at 20% 40%, rgba(124,58,237,0.04) 0%, transparent 50%), var(--void); }
        .app-shell { position: relative; z-index: 1; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--void-2), var(--void)); }
        @media (min-width: 640px) { .app-shell { height: min(900px,96vh); border-radius: 32px; margin-top: 2vh; box-shadow: 0 0 0 8px #0a0c14, 0 0 0 9px var(--line-2), 0 50px 120px -30px rgba(0,0,0,0.8); } body.light-mode .app-shell { box-shadow: 0 0 0 8px #e2e8f0, 0 0 0 9px #cbd5e1, 0 50px 120px -30px rgba(0,0,0,0.2); } }

        /* Chat Header */
        .chat-header { flex: 0 0 auto; padding: calc(0.6rem + var(--safe-t)) 1rem 0.5rem; display: flex; align-items: center; gap: 0.7rem; background: linear-gradient(180deg, var(--void-2), transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
        .chat-header .back-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--text-dim); font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .chat-header .back-btn:hover { background: var(--surface-3); color: var(--text); transform: scale(1.05); }
        .chat-header .chat-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--surface-3), var(--surface-2)); display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; color: var(--text-dim); flex-shrink: 0; position: relative; }
        .chat-header .chat-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .chat-header .chat-avatar .online-dot { position: absolute; bottom: 1px; right: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--go); border: 2px solid var(--void); box-shadow: 0 0 4px var(--go-glow); }
        .chat-header .chat-info { flex: 1; min-width: 0; }
        .chat-header .chat-name { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header .chat-status { font-size: 0.7rem; color: var(--text-faint); display: flex; align-items: center; gap: 0.3rem; }
        .chat-header .header-actions { display: flex; gap: 0.4rem; }
        .chat-header .header-actions button { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--text-dim); font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .chat-header .header-actions button:hover { background: var(--surface-3); color: var(--text); transform: scale(1.08); }
        .chat-header .header-actions button.call-btn:hover { background: var(--go); color: #fff; box-shadow: 0 0 12px var(--go-glow); }
        .chat-header .header-actions button.video-btn:hover { background: var(--primary); color: #fff; box-shadow: 0 0 12px var(--primary-glow); }

        /* Messages Area */
        .messages-area { flex: 1; min-height: 0; overflow-y: auto; padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
        .messages-area::-webkit-scrollbar { width: 3px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; }

        /* Day divider */
        .day-divider { text-align: center; margin: 0.6rem 0; position: relative; }
        .day-divider::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
        .day-divider span { position: relative; background: var(--void); padding: 0 0.8rem; font-size: 0.65rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }

        /* Message bubbles */
        .msg-row { display: flex; width: 100%; animation: msgIn 0.25s ease; }
        .msg-row.me { justify-content: flex-end; }
        .msg-row.them { justify-content: flex-start; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .msg-bubble { max-width: 78%; padding: 0.55rem 0.85rem; border-radius: var(--radius-lg); font-size: 0.88rem; line-height: 1.45; word-break: break-word; position: relative; }
        .msg-bubble.me { background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 16px var(--primary-glow); }
        .msg-bubble.them { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
        .msg-bubble .msg-time { font-size: 0.6rem; opacity: 0.65; margin-top: 0.2rem; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 0.2rem; }
        .msg-bubble.me .msg-time { color: rgba(255,255,255,0.7); }
        .msg-bubble.them .msg-time { color: var(--text-faint); }
        .msg-bubble .msg-status { font-size: 0.55rem; }
        .msg-bubble img { max-width: 100%; border-radius: var(--radius-sm); margin: 0.2rem 0; cursor: pointer; }
        .msg-bubble .file-attach { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem; background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); cursor: pointer; }
        .msg-bubble .file-attach i { font-size: 1rem; }
        .msg-bubble .file-attach span { font-size: 0.75rem; }

        /* Typing indicator */
        .typing-row { display: flex; justify-content: flex-start; margin: 0.3rem 0; }
        .typing-bubble { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-lg); border-bottom-left-radius: 4px; padding: 0.6rem 0.9rem; display: flex; align-items: center; gap: 4px; }
        .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: typingBounce 1.4s infinite ease-in-out both; }
        .typing-bubble span:nth-child(1) { animation-delay: -0.32s; }
        .typing-bubble span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        /* Input Area */
        .input-area { flex: 0 0 auto; padding: 0.5rem 1rem calc(0.6rem + var(--safe-b)); background: linear-gradient(0deg, var(--void-2), transparent); border-top: 1px solid var(--line); backdrop-filter: blur(12px); }
        .input-row { display: flex; align-items: flex-end; gap: 0.5rem; }
        .input-row .attach-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--text-dim); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .input-row .attach-btn:hover { background: var(--surface-3); color: var(--text); }
        .input-row .input-wrap { flex: 1; position: relative; }
        .input-row .input-wrap textarea { width: 100%; padding: 0.6rem 2.5rem 0.6rem 1rem; border-radius: var(--radius-xl); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 0.9rem; font-family: var(--font-body); outline: none; resize: none; max-height: 120px; min-height: 42px; line-height: 1.4; transition: all 0.2s; }
        .input-row .input-wrap textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .input-row .input-wrap textarea::placeholder { color: var(--text-faint); }
        .input-row .input-wrap .emoji-btn { position: absolute; right: 0.6rem; bottom: 0.5rem; background: none; border: none; color: var(--text-faint); font-size: 1rem; cursor: pointer; }
        .input-row .send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; box-shadow: 0 4px 16px var(--primary-glow); }
        .input-row .send-btn:hover { transform: scale(1.08); }
        .input-row .send-btn:active { transform: scale(0.95); }
        .input-row .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Scroll to bottom */
        .scroll-bottom { position: fixed; bottom: calc(5rem + var(--safe-b)); right: 1.2rem; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 10; font-size: 0.8rem; }
        .scroll-bottom.visible { opacity: 1; pointer-events: auto; }
        .scroll-bottom:hover { background: var(--primary); color: #fff; }
        @media (min-width: 640px) { .scroll-bottom { right: calc(50% - 200px + 1.2rem); } }

        /* Image preview modal */
        .img-preview-overlay { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
        .img-preview-overlay.active { display: flex; }
        .img-preview-overlay img { max-width: 92%; max-height: 85vh; border-radius: var(--radius-md); }
        .img-preview-overlay .close-preview { position: absolute; top: 1rem; right: 1rem; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }

        /* Toast */
        #toast { position: fixed; bottom: calc(5rem + var(--safe-b)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface-3); border: 1px solid var(--line-2); color: var(--text); padding: 0.7rem 1.4rem; border-radius: 40px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 6000; max-width: 88%; text-align: center; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Voice recording */
        .voice-recording { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem; background: rgba(244,63,94,0.1); border: 1px solid var(--stop); border-radius: var(--radius-xl); color: var(--stop); font-size: 0.8rem; }
        .voice-recording .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stop); animation: recBlink 1s infinite; }
        @keyframes recBlink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="app-shell">
        <div class="chat-header">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
            <div class="chat-avatar" id="chatAvatar">👤</div>
            <div class="chat-info">
                <div class="chat-name" id="chatName">Unknown</div>
                <div class="chat-status" id="chatStatus"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--go);"></span> online</div>
            </div>
            <div class="header-actions">
                <button class="call-btn" id="audioCallBtn" title="Voice call"><i class="fas fa-phone"></i></button>
                <button class="video-btn" id="videoCallBtn" title="Video call"><i class="fas fa-video"></i></button>
                <button id="moreBtn" title="More"><i class="fas fa-ellipsis-vertical"></i></button>
            </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <button class="scroll-bottom" id="scrollBottom"><i class="fas fa-chevron-down"></i></button>
        <div class="input-area">
            <div class="input-row" id="inputRow">
                <button class="attach-btn" id="attachBtn" title="Attach"><i class="fas fa-plus"></i></button>
                <div class="input-wrap">
                    <textarea id="msgInput" placeholder="Type a message..." rows="1"></textarea>
                    <button class="emoji-btn" id="emojiBtn">😊</button>
                </div>
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="input-row" id="voiceRow" style="display:none;">
                <div class="voice-recording" style="flex:1; justify-content:center;">
                    <div class="rec-dot"></div>
                    <span>Recording... <span id="recTime">00:00</span></span>
                </div>
                <button class="attach-btn" id="stopRecBtn" style="background:var(--stop); color:#fff;"><i class="fas fa-stop"></i></button>
            </div>
        </div>
    </div>
    <div class="img-preview-overlay" id="imgPreviewOverlay">
        <button class="close-preview" id="closePreview"><i class="fas fa-xmark"></i></button>
        <img id="previewImg" src="" alt="Preview">
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx" style="display:none;">
    <div id="toast"></div>

    <script>
    (function() {
        'use strict';
        const RAGINA_NUMBER = '0000000000';
        const API_URL = 'https://ragina-crawler-ragina.vercel.app/api/ask';
        const urlParams = new URLSearchParams(window.location.search);
        const chatNumber = urlParams.get('to') || '';
        const startVideo = urlParams.get('video') === '1';
        const isRAGina = chatNumber === RAGINA_NUMBER;

        const $ = id => document.getElementById(id);
        const showToast = msg => {
            const t = $('toast'); t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        };

        const getContacts = () => { try { return JSON.parse(localStorage.getItem('premCallContacts')) || []; } catch(e) { return []; } };
        const getMessages = () => { try { return JSON.parse(localStorage.getItem('premCallMessages')) || {}; } catch(e) { return {}; } };
        const saveMessages = m => localStorage.setItem('premCallMessages', JSON.stringify(m));
        const getHistory = () => { try { return JSON.parse(localStorage.getItem('premCallHistory')) || []; } catch(e) { return []; } };
        const saveHistory = h => localStorage.setItem('premCallHistory', JSON.stringify(h));

        function resolveName(num) {
            const c = getContacts().find(x => x.number === num);
            return c ? c.name : (num === RAGINA_NUMBER ? 'RAGina AI' : num);
        }
        function initials(label) {
            if (!label) return '👤';
            if (/^[\d+\s-]+$/.test(label)) return label.replace(/\D/g,'').slice(-2) || '👤';
            return label.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
        }
        function formatTime(ts) {
            return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        function formatDay(ts) {
            const d = new Date(ts);
            const today = new Date();
            if (d.toDateString() === today.toDateString()) return 'Today';
            const yest = new Date(); yest.setDate(yest.getDate()-1);
            if (d.toDateString() === yest.toDateString()) return 'Yesterday';
            return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        }

        // Header
        const name = resolveName(chatNumber);
        $('chatName').textContent = name;
        $('chatAvatar').textContent = initials(name);
        if (isRAGina) {
            $('chatAvatar').innerHTML = '🤖';
            $('chatStatus').innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--primary);"></span> AI Assistant';
        } else {
            $('chatStatus').innerHTML = '<span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--go);"></span> online';
        }

        // Render messages
        function renderMessages() {
            const area = $('messagesArea');
            const msgs = getMessages()[chatNumber] || [];
            area.innerHTML = '';
            let lastDay = '';
            msgs.forEach((m, i) => {
                const day = formatDay(m.time);
                if (day !== lastDay) {
                    const div = document.createElement('div');
                    div.className = 'day-divider';
                    div.innerHTML = `<span>${day}</span>`;
                    area.appendChild(div);
                    lastDay = day;
                }
                const row = document.createElement('div');
                row.className = 'msg-row ' + m.sender;
                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble ' + m.sender;
                if (m.type === 'image') {
                    bubble.innerHTML = `<img src="${m.text}" alt="Image" onclick="window.showImgPreview('${m.text}')">`;
                } else if (m.type === 'file') {
                    bubble.innerHTML = `<div class="file-attach" onclick="window.downloadFile('${m.text}', '${m.fileName || 'file'}')"><i class="fas fa-file"></i><span>${m.fileName || 'File'}</span></div>`;
                } else {
                    bubble.textContent = m.text;
                }
                const time = document.createElement('div');
                time.className = 'msg-time';
                time.innerHTML = formatTime(m.time) + (m.sender === 'me' ? ` <span class="msg-status">${m.read ? '<i class="fas fa-check-double"></i>' : '<i class="fas fa-check"></i>'}</span>` : '');
                bubble.appendChild(time);
                row.appendChild(bubble);
                area.appendChild(row);
            });
            scrollToBottom();
        }

        function scrollToBottom() {
            const area = $('messagesArea');
            area.scrollTop = area.scrollHeight;
        }

        function addMessage(text, sender, type='text', fileName) {
            const msgs = getMessages();
            if (!msgs[chatNumber]) msgs[chatNumber] = [];
            msgs[chatNumber].push({ sender, text, type, time: Date.now(), read: sender === 'me', fileName });
            saveMessages(msgs);
            renderMessages();
        }

        // Send message
        async function sendMessage() {
            const input = $('msgInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            input.style.height = 'auto';
            addMessage(text, 'me', 'text');

            if (isRAGina) {
                showTyping();
                const ans = await askRAGina(text);
                hideTyping();
                addMessage(ans, 'them', 'text');
            } else {
                // Send via PeerJS
                const myId = localStorage.getItem('premCallId');
                if (typeof Peer !== 'undefined' && myId) {
                    try {
                        const peer = new Peer(myId, { debug: 0 });
                        peer.on('open', () => {
                            const conn = peer.connect(chatNumber);
                            conn.on('open', () => conn.send({ type: 'msg', text }));
                        });
                    } catch(e) {}
                }
            }
        }

        async function askRAGina(query) {
            try {
                const resp = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: 'You are RAGina, a friendly assistant. Answer concisely:\n' + query }) });
                if (!resp.ok) throw 0;
                return (await resp.json()).text || 'No response.';
            } catch(e) { return "I'm having trouble answering right now. Please try again."; }
        }

        let typingEl = null;
        function showTyping() {
            if (typingEl) return;
            typingEl = document.createElement('div');
            typingEl.className = 'typing-row';
            typingEl.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
            $('messagesArea').appendChild(typingEl);
            scrollToBottom();
        }
        function hideTyping() {
            if (typingEl) { typingEl.remove(); typingEl = null; }
        }

        // Event listeners
        $('sendBtn').addEventListener('click', sendMessage);
        $('msgInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        $('msgInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        $('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
        $('audioCallBtn').addEventListener('click', () => {
            if (window.opener && window.opener.PremCall) {
                window.opener.PremCall.call(chatNumber);
                showToast('Calling ' + name + '...');
            } else {
                localStorage.setItem('premCallPendingCall', JSON.stringify({ number: chatNumber, video: false }));
                window.location.href = 'index.html';
            }
        });
        $('videoCallBtn').addEventListener('click', () => {
            if (window.opener && window.opener.PremCall) {
                window.opener.PremCall.call(chatNumber, true);
                showToast('Video calling ' + name + '...');
            } else {
                localStorage.setItem('premCallPendingCall', JSON.stringify({ number: chatNumber, video: true }));
                window.location.href = 'index.html';
            }
        });
        $('attachBtn').addEventListener('click', () => $('fileInput').click());
        $('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { showToast('File too large (max 5MB)'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                const isImg = file.type.startsWith('image/');
                addMessage(reader.result, 'me', isImg ? 'image' : 'file', file.name);
            };
            if (file.type.startsWith('image/')) reader.readAsDataURL(file);
            else reader.readAsDataURL(file);
            e.target.value = '';
        });
        $('emojiBtn').addEventListener('click', () => {
            const emojis = ['😀','😂','❤️','👍','🔥','🎉','😭','🤔','👏','🙏'];
            const picker = document.createElement('div');
            picker.style.cssText = 'position:absolute; bottom:70px; left:1rem; right:1rem; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-lg); padding:0.5rem; display:flex; gap:0.3rem; flex-wrap:wrap; z-index:100;';
            emojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.textContent = emoji;
                btn.style.cssText = 'background:none; border:none; font-size:1.3rem; cursor:pointer; padding:0.3rem; border-radius:8px;';
                btn.addEventListener('click', () => {
                    $('msgInput').value += emoji;
                    picker.remove();
                });
                picker.appendChild(btn);
            });
            document.querySelector('.app-shell').appendChild(picker);
            setTimeout(() => {
                document.addEventListener('click', function closePicker(e) {
                    if (!picker.contains(e.target) && e.target !== $('emojiBtn')) { picker.remove(); document.removeEventListener('click', closePicker); }
                });
            }, 10);
        });

        // Scroll detection
        $('messagesArea').addEventListener('scroll', () => {
            const area = $('messagesArea');
            const nearBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 100;
            $('scrollBottom').classList.toggle('visible', !nearBottom);
        });
        $('scrollBottom').addEventListener('click', scrollToBottom);

        // Image preview
        window.showImgPreview = src => {
            $('previewImg').src = src;
            $('imgPreviewOverlay').classList.add('active');
        };
        window.downloadFile = (dataUrl, fileName) => {
            const a = document.createElement('a');
            a.href = dataUrl; a.download = fileName;
            document.body.appendChild(a); a.click(); a.remove();
        };
        $('closePreview').addEventListener('click', () => $('imgPreviewOverlay').classList.remove('active'));
        $('imgPreviewOverlay').addEventListener('click', (e) => { if (e.target === $('imgPreviewOverlay')) $('imgPreviewOverlay').classList.remove('active'); });

        // Auto-call if video param
        if (startVideo) {
            setTimeout(() => {
                if (window.opener && window.opener.PremCall) {
                    window.opener.PremCall.call(chatNumber, true);
                } else {
                    localStorage.setItem('premCallPendingCall', JSON.stringify({ number: chatNumber, video: true }));
                    window.location.href = 'index.html';
                }
            }, 500);
        }

        renderMessages();
    })();
    </script>
</body>
</html>
